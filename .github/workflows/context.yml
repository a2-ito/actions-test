name: context

on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

jobs:
  print:
    runs-on: ubuntu-latest
    steps:
    - name: Control a condition of BG Deployment
      run: |
        echo "github.ref: ${{ github.ref }}"
        echo "github.event.label.name: ${{ github.event.label.name }}"
        echo "github.event.ref: ${{ github.event.ref }}"
        echo "github.event.pull_request.base.ref: ${{ github.event.pull_request.base.ref }}"
        echo "github.event.pull_request.base_ref: ${{ github.event.pull_request.base_ref }}"
        echo "github.base_ref: ${{ github.base_ref }}"
        echo "github.head_ref: ${{ github.head_ref }}"
        echo "github.ref_name: ${{ github.ref_name }}"
        echo "github.event.push.bae_ref: ${{ github.event.push.base_ref }}"
        echo "github.event.push.ref: ${{ github.event.push.ref }}"
        echo "github.event.push.ref_name: ${{ github.event.push.ref_name }}"

