name: Matrix

on:
  workflow_dispatch:

jobs:
  print-matrix-1:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Print
        run: |
          echo "OS: ${{ matrix.os }}"

  print-matrix-2:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Print
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node: ${{ matrix.node }}"

  print-matrix-3:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: macos-latest
            node: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@4
        with:
          node-version: ${{ matrix.node }}
      - run: |
          echo "OS: ${{ matrix.os }}"


